name: Build ROOTHIDE Deb

on:
  workflow_dispatch:
  push:
    branches: [main, custom]

jobs:
  build-deb:
    name: Build ROOTHIDE Deb
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Theos cache key
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Cache Theos
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos (roothide)
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Build ROOTHIDE package
        run: |
          set -e
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          ls -la packages
          find packages -name '*.deb' -print

      - name: Upload Deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTMusicUltimate-roothide-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ github.run_number }}
          name: Custom ROOTHIDE ${{ github.run_number }}
          files: packages/*.deb
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
